<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>DV2 - Malaysia E&E Exports</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }

    .content-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .chart-box {
      margin-top: 20px;
      margin-bottom: 60px;
      display: flex;
      justify-content: center;
    }

    .story-text {
      line-height: 1.6;
      color: #333;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="content-container">
    <h1 style="text-align: center;">Malaysia's Silicon Valley: Semiconductor Exports</h1>

    <h2>1. The National Growth Trend</h2>
    <p class="story-text">This chart shows the rapid growth of E&E exports over the last few years.</p>
    <div id="vis-trend" class="chart-box"></div>

    <h2>2. State-level Dominance</h2>
    <p class="story-text">Hover over the states to reveal the dominance of regions like Penang and Selangor.</p>
    <div id="vis-map" class="chart-box"></div>
  </div>

  <script>
    var specTrend = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 800,
      "height": 400,
      "data": {
        "values": [
          { "year": "2018-01-01", "exports": 380000 },
          { "year": "2019-01-01", "exports": 372000 },
          { "year": "2020-01-01", "exports": 386000 },
          { "year": "2021-01-01", "exports": 455000 },
          { "year": "2022-01-01", "exports": 593000 },
          { "year": "2023-01-01", "exports": 575000 }
        ]
      },
      "mark": {
        "type": "area",
        "line": { "color": "#1f77b4" },
        "color": {
          "x1": 1, "y1": 1, "x2": 1, "y2": 0, "gradient": "linear",
          "stops": [{ "offset": 0, "color": "white" }, { "offset": 1, "color": "#1f77b4" }]
        }
      },
      "encoding": {
        "x": {
          "field": "year",
          "type": "temporal",
          "timeUnit": "year",
          "axis": { "title": "Year", "grid": false, "labelAngle": 0 }
        },
        "y": {
          "field": "exports",
          "type": "quantitative",
          "axis": { "title": "Export Value (RM)", "format": "s" }
        },
        "tooltip": [
          { "field": "year", "type": "temporal", "timeUnit": "year", "title": "Year" },
          { "field": "exports", "type": "quantitative", "title": "Total Exports", "format": "," }
        ]
      }
    };

    var specMap = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 800,
      "height": 500,
      "projection": { "type": "mercator", "scale": 2500, "center": [109.5, 4.0] },
      "data": {
        "url": "malaysia.geojson",
        "format": { "type": "json", "property": "features" }
      },
      "transform": [
        {
          "lookup": "properties.name",
          "from": {
            "data": {
              "values": [
                { "state": "Johor", "exports": 45000 },
                { "state": "Kedah", "exports": 32000 },
                { "state": "Pulau Pinang", "exports": 280000 },
                { "state": "Selangor", "exports": 150000 },
                { "state": "Sarawak", "exports": 19000 },
                { "state": "Perak", "exports": 15000 }
              ]
            },
            "key": "state",
            "fields": ["exports"]
          }
        }
      ],
      "mark": { "type": "geoshape", "stroke": "white", "strokeWidth": 0.5 },
      "encoding": {
        "color": {
          "field": "exports",
          "type": "quantitative",
          "scale": { "type": "log", "scheme": "blues" },
          "legend": { "title": "Exports (RM)" }
        },
        "tooltip": [
          { "field": "properties.name", "type": "nominal", "title": "State" },
          { "field": "exports", "type": "quantitative", "title": "Exports (RM)", "format": "," }
        ]
      }
    };

    vegaEmbed('#vis-trend', specTrend).catch(console.error);
    vegaEmbed('#vis-map', specMap).catch(console.error);
  </script>
</body>

</html>
